# Keeps this fork's main branch in step with storytold/artcraft.
#
# Optional: add a repo secret SYNC_TOKEN (a fine-grained PAT with Contents +
# Workflows write on this fork). Without it, syncs still work, but any upstream
# commit that edits files under .github/workflows/ will be rejected by GitHub.
name: Sync from upstream

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream main into fork main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main
